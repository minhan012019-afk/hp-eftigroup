<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Đồng Đội">
<meta name="theme-color" content="#2563eb">
<title>Đồng Đội - Quản lý công việc</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f3ef;--fg:#1a1a1a;--fg2:#555;--fg3:#999;
  --accent:#2563eb;--accent-h:#1d4ed8;--accent-s:#eff4ff;
  --green:#059669;--green-s:#ecfdf5;--amber:#d97706;--amber-s:#fffbeb;
  --red:#dc2626;--red-s:#fef2f2;--purple:#7c3aed;--purple-s:#f5f3ff;--teal:#0891b2;--teal-s:#ecfeff;
  --card:#fff;--border:#e5e3de;--hover:#f0eeea;
  --sidebar:#fff;--sidebar-a:#eff4ff;--sel:#dbeafe;
  --radius:10px;--radius-s:6px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111;--fg:#eee;--fg2:#aaa;--fg3:#666;
  --accent:#60a5fa;--accent-h:#93bbfd;--accent-s:#1e2a3a;
  --green:#34d399;--green-s:#0d2818;--amber:#fbbf24;--amber-s:#2a1f0a;
  --red:#f87171;--red-s:#2a0f14;--purple:#a78bfa;--purple-s:#1a142a;--teal:#67e8f9;--teal-s:#0a1f25;
  --card:#1a1a1a;--border:#2a2a2a;--hover:#222;
  --sidebar:#161616;--sidebar-a:#1e2a3a;--sel:#1e3a5f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111;--fg:#eee;--fg2:#aaa;--fg3:#666;
  --accent:#60a5fa;--accent-h:#93bbfd;--accent-s:#1e2a3a;
  --green:#34d399;--green-s:#0d2818;--amber:#fbbf24;--amber-s:#2a1f0a;
  --red:#f87171;--red-s:#2a0f14;--purple:#a78bfa;--purple-s:#1a142a;--teal:#67e8f9;--teal-s:#0a1f25;
  --card:#1a1a1a;--border:#2a2a2a;--hover:#222;
  --sidebar:#161616;--sidebar-a:#1e2a3a;--sel:#1e3a5f;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:14px;display:flex;overflow:hidden;line-height:1.5}

/* ===== Sidebar ===== */
.side{width:260px;min-width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;z-index:20;transition:transform .25s ease}
.side-head{padding:calc(var(--safe-t) + 14px) 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.side-logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;font-weight:700;flex-shrink:0}
.side-head h1{font-size:14px;font-weight:700;letter-spacing:-.3px}
.side-head small{font-size:10px;color:var(--fg3);display:block;margin-top:1px}
.side-tree{flex:1;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.side-tree::-webkit-scrollbar{width:0}

.nd{margin-bottom:1px}
.nd-row{display:flex;align-items:center;padding:8px 10px;border-radius:var(--radius-s);cursor:pointer;gap:7px;font-size:13px;transition:background .12s;position:relative;min-height:40px;user-select:none}
.nd-row:hover,.nd-row:active{background:var(--hover)}
.nd-row.act{background:var(--sidebar-a);color:var(--accent);font-weight:600}
.nd-row.act::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0}
.nd-ico{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.nd-lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd-cnt{font-size:10px;background:var(--border);padding:1px 6px;border-radius:10px;color:var(--fg2);font-weight:500}
.nd-arr{font-size:7px;color:var(--fg3);width:14px;text-align:center;transition:transform .2s;flex-shrink:0}
.nd-arr.open{transform:rotate(90deg)}
.nd-kids{margin-left:18px;border-left:2px solid var(--border);padding-left:2px}

/* ===== Main ===== */
.main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}

/* Toolbar */
.toolbar{padding:calc(var(--safe-t) + 8px) 12px 8px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.menu-btn{width:38px;height:38px;border:none;border-radius:var(--radius-s);background:transparent;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:18px;color:var(--fg);flex-shrink:0}
.tb-info{flex:1;min-width:120px}
.tb-info .crumb{font-size:10px;color:var(--fg3);display:flex;align-items:center;gap:3px}
.tb-info .crumb span{cursor:pointer}.tb-info .crumb span:hover{color:var(--accent)}
.tb-info h2{font-size:16px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-search{position:relative;flex-shrink:0}
.tb-search input{padding:7px 10px 7px 28px;border:1px solid var(--border);border-radius:var(--radius);font-size:12px;width:160px;background:var(--bg);color:var(--fg);font-family:inherit;outline:none}
.tb-search input:focus{border-color:var(--accent);width:200px}
.tb-search::before{content:'🔍';position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none}
.tb-acts{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.tb-btn{padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--card);color:var(--fg);font-size:12px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;min-height:34px}
.tb-btn:hover{background:var(--hover)}
.tb-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb-btn.primary:hover{background:var(--accent-h)}
.tb-btn.danger{color:var(--red)}
.tb-btn[disabled]{opacity:.4;pointer-events:none}

/* Address bar */
.addr{padding:4px 12px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:6px;flex-shrink:0}
.addr-btn{width:28px;height:28px;border:none;border-radius:var(--radius-s);background:transparent;cursor:pointer;font-size:14px;color:var(--fg2);display:flex;align-items:center;justify-content:center}
.addr-btn:hover{background:var(--hover)}
.addr-btn[disabled]{opacity:.3;pointer-events:none}
.addr-path{flex:1;font-size:12px;color:var(--fg2);padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr-path span{cursor:pointer;color:var(--fg)}.addr-path span:hover{color:var(--accent);text-decoration:underline}
.addr-info{font-size:11px;color:var(--fg3);white-space:nowrap}

/* Content */
.ct{flex:1;overflow-y:auto;padding:12px;padding-bottom:calc(var(--safe-b) + 12px);-webkit-overflow-scrolling:touch;position:relative}
.ct::-webkit-scrollbar{width:0}

/* Status bar */
.status{padding:4px 12px;padding-bottom:calc(var(--safe-b) + 4px);border-top:1px solid var(--border);background:var(--card);font-size:11px;color:var(--fg3);display:flex;justify-content:space-between;flex-shrink:0}

/* ===== Views ===== */
/* -- Tiles -- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 10px;text-align:center;cursor:pointer;transition:all .12s;user-select:none;position:relative}
.tile:hover,.tile:active{border-color:var(--accent);background:var(--accent-s)}
.tile.selected{background:var(--sel);border-color:var(--accent)}
.tile-ico{font-size:32px;margin-bottom:4px}
.tile-lbl{font-size:11px;font-weight:500;line-height:1.3;word-break:break-word}
.tile-cnt{font-size:18px;font-weight:700;margin-top:2px;color:var(--accent);font-variant-numeric:tabular-nums}
.tile-type{font-size:9px;color:var(--fg3);margin-top:2px}

/* -- List view -- */
.list-head{display:flex;padding:6px 10px;font-size:11px;font-weight:600;color:var(--fg3);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.3px;user-select:none}
.list-head>div{cursor:pointer;display:flex;align-items:center;gap:2px}
.list-head>div:hover{color:var(--fg)}
.list-row{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;min-height:40px;user-select:none}
.list-row:hover{background:var(--hover)}
.list-row.selected{background:var(--sel)}
.lc-check{width:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.lc-check input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.lc-ico{width:28px;font-size:16px;text-align:center;flex-shrink:0}
.lc-name{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-name.editing{overflow:visible}
.lc-name input{font-size:13px;font-family:inherit;padding:2px 6px;border:1px solid var(--accent);border-radius:3px;outline:none;background:var(--card);color:var(--fg);width:100%}
.lc-status{width:90px;flex-shrink:0;text-align:center}
.lc-type{width:70px;flex-shrink:0;text-align:center}
.lc-date{width:90px;flex-shrink:0;font-size:11px;color:var(--fg3);text-align:right}
.lc-acts{width:60px;flex-shrink:0;display:flex;justify-content:flex-end;gap:2px}
.lc-acts button{width:28px;height:28px;border:none;border-radius:var(--radius-s);background:transparent;cursor:pointer;font-size:13px;color:var(--fg2)}
.lc-acts button:hover{background:var(--hover)}

.badge{display:inline-flex;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.b-a{background:var(--green-s);color:var(--green)}.b-p{background:var(--amber-s);color:var(--amber)}.b-d{background:var(--border);color:var(--fg3)}
.tag{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600}
.t-dn{background:var(--accent-s);color:var(--accent)}.t-hcsn{background:var(--amber-s);color:var(--amber)}.t-cn{background:var(--green-s);color:var(--green)}
.t-cg{background:var(--purple-s);color:var(--purple)}.t-hs{background:var(--teal-s);color:var(--teal)}.t-qt{background:var(--red-s);color:var(--red)}
.t-folder{background:var(--amber-s);color:var(--amber)}
.t-idea{background:#fef9c3;color:#a16207}
.bk-modal{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.bk-box{background:var(--card);border-radius:var(--radius);max-width:420px;width:100%;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.bk-box h3{margin-bottom:12px;font-size:16px}
.bk-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bk-btn{flex:1;padding:10px;border:1px solid var(--border);border-radius:var(--radius-s);background:var(--card);color:var(--fg);font-size:13px;cursor:pointer;text-align:center;min-width:120px}
.bk-btn:hover{background:var(--hover)}
.bk-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.bk-info{font-size:12px;color:var(--fg3);margin-top:8px;line-height:1.6}
.bk-info b{color:var(--fg2)}
.bk-close{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--fg3)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-idea{background:#2a2410;color:#fbbf24}}
:root[data-theme="dark"] .t-idea{background:#2a2410;color:#fbbf24}

/* Dashboard */
.dash-hi{margin-bottom:16px}
.dash-hi h3{font-size:18px;font-weight:700}
.dash-hi p{color:var(--fg2);font-size:12px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-ico{font-size:22px;margin-bottom:4px}
.stat-val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:10px;color:var(--fg3);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.sec-title{font-size:12px;font-weight:700;color:var(--fg2);margin-bottom:8px}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center}
.empty-ico{font-size:44px;opacity:.2;margin-bottom:8px}
.empty h4{font-size:14px;font-weight:600;margin-bottom:3px}
.empty p{color:var(--fg3);font-size:12px;max-width:220px}

/* ===== Context Menu ===== */
.ctx{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:50;min-width:180px;padding:4px;display:none;font-size:13px}
.ctx.show{display:block}
.ctx-item{padding:8px 12px;border-radius:var(--radius-s);cursor:pointer;display:flex;align-items:center;gap:8px;min-height:36px}
.ctx-item:hover{background:var(--hover)}
.ctx-item.danger{color:var(--red)}
.ctx-item.disabled{opacity:.4;pointer-events:none}
.ctx-sep{height:1px;background:var(--border);margin:4px 8px}
.ctx-ico{width:20px;text-align:center;font-size:14px}
.ctx-key{margin-left:auto;font-size:10px;color:var(--fg3)}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:var(--card);width:100%;max-width:440px;max-height:88vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.m-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.m-head h3{font-size:15px;font-weight:700}
.m-close{width:30px;height:30px;border:none;border-radius:50%;background:var(--hover);cursor:pointer;font-size:14px;color:var(--fg2);display:flex;align-items:center;justify-content:center}
.m-body{padding:14px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.m-foot{padding:10px 18px;padding-bottom:calc(var(--safe-b) + 10px);border-top:1px solid var(--border);display:flex;gap:6px;justify-content:flex-end}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:600;margin-bottom:4px;color:var(--fg2)}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-s);font-size:13px;font-family:inherit;background:var(--bg);color:var(--fg);outline:none;-webkit-appearance:none;min-height:40px}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent)}
.fg textarea{min-height:70px;resize:vertical}
.m-btn{padding:9px 18px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;background:var(--card);color:var(--fg);min-height:38px}
.m-btn:hover{background:var(--hover)}
.m-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.m-primary:hover{background:var(--accent-h)}
.m-del{color:var(--red);border-color:var(--red);background:transparent}.m-del:hover{background:var(--red-s)}

/* Shade */
.shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
.shade.show{display:block}

/* Toast */
.toast{position:fixed;bottom:calc(var(--safe-b) + 60px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 20px;border-radius:20px;font-size:12px;font-weight:500;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* Desktop */
@media(min-width:769px){
  .menu-btn{display:none !important}
  .shade{display:none !important}
  .modal{border-radius:14px;margin-bottom:5vh}
  .modal-bg{align-items:center}
  .tb-search input{transition:width .15s}
}
/* Mobile */
@media(max-width:768px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:0 0 24px rgba(0,0,0,.15)}
  .side.open{transform:none}
  .menu-btn{display:flex !important}
  .tb-search input{width:100px}
  .tb-search input:focus{width:130px}
  .tb-btn span{display:none}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lc-status,.lc-type,.lc-date,.lc-acts{display:none}
  .addr{display:none}
  .list-head{display:none}
}
@media(max-width:380px){
  .tb-search{display:none}
}

/* ===== Bong bóng Ý tưởng ===== */
.idea-fab{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;font-size:24px;
  cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;display:flex;align-items:center;
  justify-content:center;transition:transform .15s,box-shadow .15s}
.idea-fab:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.idea-fab:active{transform:scale(.95)}
.idea-fab .idea-count{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;
  font-size:9px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;
  align-items:center;justify-content:center;padding:0 4px;line-height:1}
body.idea-open .idea-fab{background:linear-gradient(135deg,#78716c,#57534e)}

.idea-panel{position:fixed;right:18px;bottom:80px;width:360px;max-width:calc(100vw - 24px);
  height:520px;max-height:calc(100vh - 120px);background:var(--card);border:1px solid var(--border);
  border-radius:14px;box-shadow:0 12px 44px rgba(0,0,0,.25);display:none;flex-direction:column;
  overflow:hidden;z-index:61;animation:slideUp .2s ease}
body.idea-open .idea-panel{display:flex}

.idea-head{display:flex;align-items:center;padding:12px 14px;
  background:linear-gradient(90deg,#f59e0b,#d97706);color:#fff;font-weight:700;font-size:14px;gap:8px}
.idea-head span{flex:1}
.idea-head button{color:#fff;background:none;border:none;font-size:16px;cursor:pointer;
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.idea-head button:hover{background:rgba(255,255,255,.2)}

.idea-input{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.idea-input textarea{width:100%;min-height:60px;max-height:120px;padding:9px 12px;border:1px solid var(--border);
  border-radius:var(--radius-s);font-size:13px;font-family:inherit;background:var(--bg);color:var(--fg);
  outline:none;resize:vertical;line-height:1.5}
.idea-input textarea:focus{border-color:var(--accent)}
.idea-input textarea::placeholder{color:var(--fg3)}
.idea-input-row{display:flex;gap:6px;align-items:center}
.idea-input-row select{padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-s);
  font-size:12px;background:var(--bg);color:var(--fg);font-family:inherit;outline:none;flex:1}
.idea-input-row button{padding:7px 16px;border:none;border-radius:var(--radius-s);
  background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;white-space:nowrap}
.idea-input-row button:hover{filter:brightness(1.05)}
.idea-input-row button:active{filter:brightness(.95)}

.idea-list{flex:1;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.idea-list::-webkit-scrollbar{width:0}
.idea-item{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:6px;cursor:default;transition:background .1s;position:relative}
.idea-item:hover{background:var(--hover)}
.idea-item-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.idea-item-pri{font-size:8px;line-height:1}
.idea-item-text{font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.idea-item-meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:10px;color:var(--fg3)}
.idea-item-acts{position:absolute;top:8px;right:8px;display:none;gap:2px}
.idea-item:hover .idea-item-acts{display:flex}
.idea-item-acts button{width:24px;height:24px;border:none;border-radius:var(--radius-s);
  background:var(--hover);cursor:pointer;font-size:12px;color:var(--fg2);display:flex;
  align-items:center;justify-content:center}
.idea-item-acts button:hover{background:var(--border)}
.idea-empty{text-align:center;padding:30px 16px;color:var(--fg3);font-size:13px}
.idea-empty-ico{font-size:36px;opacity:.3;margin-bottom:6px}

.idea-footer{padding:6px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--fg3);
  display:flex;justify-content:space-between;align-items:center;background:var(--bg)}
.idea-footer a{color:var(--accent);cursor:pointer;font-weight:500;text-decoration:none;font-size:11px}
.idea-footer a:hover{text-decoration:underline}

@media(max-width:560px){
  .idea-panel{right:10px;left:10px;bottom:78px;width:auto;height:72vh;max-height:72vh}
  .idea-fab{right:14px;bottom:14px;width:48px;height:48px;font-size:22px}
}
</style>
</head>
<body>

<div class="shade" id="shade" onclick="closeSidebar()"></div>
<div class="side" id="side">
  <div class="side-head">
    <div class="side-logo">Q</div>
    <div><h1>Quản lý công việc</h1><small>EFTI Group</small></div>
  </div>
  <div class="side-tree" id="tree"></div>
</div>

<div class="main">
  <div class="toolbar" id="toolbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="tb-info">
      <div class="crumb" id="crumb"></div>
      <h2 id="title">Quản lý chung</h2>
    </div>
    <div class="tb-search"><input type="text" placeholder="Tìm kiếm..." id="q" oninput="render()"></div>
    <div class="tb-acts" id="tbActs"></div>
  </div>
  <div class="addr" id="addrBar">
    <button class="addr-btn" id="btnBack" onclick="goBack()" title="Quay lại">◀</button>
    <button class="addr-btn" id="btnFwd" onclick="goFwd()" title="Tiến">▶</button>
    <button class="addr-btn" onclick="goUp()" title="Lên thư mục">⬆</button>
    <div class="addr-path" id="addrPath"></div>
    <div class="addr-info" id="addrInfo"></div>
  </div>
  <div class="ct" id="ct" oncontextmenu="onBgCtx(event)"></div>
  <div class="status" id="statusBar"><span id="stL"></span><span id="stR"></span></div>
</div>

<div class="ctx" id="ctx"></div>
<div class="modal-bg" id="mBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="mBox"></div>
</div>
<div class="toast" id="toast"></div>

<!-- 💡 Bong bóng Ý tưởng -->
<button class="idea-fab" onclick="ideaToggle()" aria-label="Ghi ý tưởng" title="Ghi ý tưởng nhanh">
  💡<span class="idea-count" id="ideaCount" style="display:none">0</span>
</button>
<div class="idea-panel" id="ideaPanel">
  <div class="idea-head">
    <span>💡 Ghi chú ý tưởng</span>
    <button onclick="nav('5.4');ideaToggle()" title="Mở tab Ý tưởng">⤢</button>
    <button onclick="ideaToggle()" title="Đóng">✕</button>
  </div>
  <div class="idea-input">
    <textarea id="ideaText" placeholder="Ghi nhanh ý tưởng đột xuất..." onkeydown="if(event.ctrlKey&&event.key==='Enter'){event.preventDefault();ideaSave()}"></textarea>
    <div class="idea-input-row">
      <select id="ideaPri">
        <option value="normal">Bình thường</option>
        <option value="high">Quan trọng</option>
        <option value="urgent">Khẩn cấp</option>
      </select>
      <button onclick="ideaSave()">💾 Lưu (Ctrl+Enter)</button>
    </div>
  </div>
  <div class="idea-list" id="ideaList"></div>
  <div class="idea-footer">
    <span id="ideaTotal">0 ý tưởng</span>
    <a onclick="nav('5.4');ideaToggle()">Xem tất cả →</a>
  </div>
</div>

<div class="bk-modal" id="bkModal" style="display:none" onclick="if(event.target===this)closeBackup()">
  <div class="bk-box">
    <button class="bk-close" onclick="closeBackup()">✕</button>
    <h3>🛡️ Sao lưu & Phục hồi dữ liệu</h3>
    <div class="bk-row">
      <button class="bk-btn primary" onclick="exportData()">📥 Xuất dữ liệu (JSON)</button>
      <button class="bk-btn" onclick="document.getElementById('importFile').click()">📤 Nhập dữ liệu</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
    <div class="bk-info" id="bkInfo"></div>
  </div>
</div>

<script>
const TREE=[
  {id:'0',label:'Quản lý chung',icon:'📊',children:[]},
  {id:'1',label:'Xây dựng chương trình',icon:'📁',oicon:'📂',children:[
    {id:'1.1',label:'Doanh nghiệp',icon:'🏢',type:'dn'},
    {id:'1.2',label:'Hành chính sự nghiệp',icon:'🏛️',type:'hcsn'},
    {id:'1.3',label:'Cá nhân',icon:'👤',type:'cn'}
  ]},
  {id:'2',label:'Chăm sóc khách hàng',icon:'📁',oicon:'📂',children:[
    {id:'2.1',label:'Doanh nghiệp',icon:'🏢',type:'dn'},
    {id:'2.2',label:'Hành chính sự nghiệp',icon:'🏛️',type:'hcsn'},
    {id:'2.3',label:'Cá nhân',icon:'👤',type:'cn'}
  ]},
  {id:'3',label:'Đội ngũ chuyên gia',icon:'🎓',children:[]},
  {id:'4',label:'Quy trình làm việc',icon:'⚙️',children:[]},
  {id:'5',label:'Kho hồ sơ lưu trữ',icon:'🗄️',children:[
    {id:'5.1',label:'Hệ thống văn bản mẫu',icon:'📄',type:'hs'},
    {id:'5.2',label:'Năm 2026',icon:'📅',type:'hs'},
    {id:'5.3',label:'Năm 2027',icon:'📅',type:'hs'},
    {id:'5.4',label:'Ý tưởng',icon:'💡',type:'idea'}
  ]}
];
const TL={dn:'Doanh nghiệp',hcsn:'HCSN',cn:'Cá nhân',cg:'Chuyên gia',hs:'Hồ sơ',qt:'Quy trình',folder:'Thư mục',idea:'Ý tưởng'};
const SL={active:'Hoạt động',pending:'Đang chờ',done:'Hoàn thành'};
const SLE={active:'Hoạt động',pending:'Chờ xác nhận',done:'Hoàn tất'};
const SLP={active:'Áp dụng',pending:'Dự thảo',done:'Ngưng'};

let cur='0',D={},exp={},sel=new Set(),clip=null,clipMode=null,viewMode='tiles',eid=null,renamingId=null;
let hist=['0'],histIdx=0,sortKey='name',sortAsc=true;
TREE.forEach(n=>{if(n.children?.length)exp[n.id]=true;});

function ld(){try{D=JSON.parse(localStorage.getItem('qlcv4')||'{}');}catch(e){D={};}}
function sv(){try{localStorage.setItem('qlcv4',JSON.stringify(D));}catch(e){}}
function its(s){return D[s]||[];}
function si(s,v){D[s]=v;sv();}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fd(t){return t?new Date(t).toLocaleDateString('vi-VN'):'—';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000);}

function fn(id){
  for(const n of TREE){if(n.id===id)return n;if(n.children)for(const c of n.children)if(c.id===id)return c;}
  const ufs=D._folders||[];
  const uf=ufs.find(f=>f.id===id);
  if(uf)return uf;
  return null;
}
function fp(id){
  for(const n of TREE)if(n.children)for(const c of n.children)if(c.id===id)return n;
  const ufs=D._folders||[];
  const uf=ufs.find(f=>f.id===id);
  if(uf)return fn(uf.parent);
  return null;
}
function getChildren(id){
  const nd=TREE.find(n=>n.id===id);
  const builtIn=nd?.children||[];
  const ufs=(D._folders||[]).filter(f=>f.parent===id);
  return [...builtIn,...ufs];
}
function cnt(nid){
  let c=its(nid).length;
  const kids=getChildren(nid);
  kids.forEach(ch=>c+=cnt(ch.id));
  return c;
}
function isUserFolder(id){return (D._folders||[]).some(f=>f.id===id);}
function addFolder(parentId,name){
  if(!D._folders)D._folders=[];
  const f={id:'f_'+gid(),label:name,icon:'📁',oicon:'📂',parent:parentId,children:[],type:'folder',createdAt:Date.now()};
  D._folders.push(f);sv();return f;
}
function renameFolder(fid,name){
  const ufs=D._folders||[];
  const f=ufs.find(x=>x.id===fid);
  if(f){f.label=name;sv();}
}
function deleteFolder(fid){
  D._folders=(D._folders||[]).filter(x=>x.id!==fid);
  delete D[fid];
  sv();
}
function getPath(id){
  const parts=[];let c=id;
  for(let i=0;i<10;i++){
    const nd=fn(c);if(!nd)break;
    parts.unshift({id:c,label:nd.label});
    const p=fp(c);if(!p)break;c=p.id;
  }
  return parts;
}

/* ===== Tree ===== */
function buildTree(){
  let h='';
  function renderNode(n,depth){
    const kids=getChildren(n.id);
    const has=kids.length>0;
    const isE=exp[n.id];const c=cnt(n.id);
    h+='<div class="nd">';
    h+='<div class="nd-row '+(cur===n.id?'act':'')+'" onclick="nav(\''+n.id+'\')" oncontextmenu="onTreeCtx(event,\''+n.id+'\')" style="padding-left:'+(8+depth*12)+'px">';
    if(has)h+='<span class="nd-arr '+(isE?'open':'')+'" onclick="event.stopPropagation();exp[\''+n.id+'\']=!exp[\''+n.id+'\'];refresh()">▶</span>';
    else h+='<span style="width:14px"></span>';
    h+='<span class="nd-ico">'+(has?(isE?(n.oicon||'📂'):n.icon):n.icon)+'</span>';
    h+='<span class="nd-lbl">'+esc(n.label)+'</span>';
    if(c)h+='<span class="nd-cnt">'+c+'</span>';
    h+='</div>';
    if(has&&isE){
      h+='<div class="nd-kids">';
      kids.forEach(ch=>renderNode(ch,depth+1));
      h+='</div>';
    }
    h+='</div>';
  }
  TREE.forEach(n=>renderNode(n,0));
  document.getElementById('tree').innerHTML=h;
}

/* ===== Navigation ===== */
function nav(id){
  if(cur!==id){
    hist=hist.slice(0,histIdx+1);
    hist.push(id);histIdx=hist.length-1;
  }
  cur=id;sel.clear();renamingId=null;
  document.getElementById('q').value='';
  closeSidebar();refresh();
}
function goBack(){if(histIdx>0){histIdx--;cur=hist[histIdx];sel.clear();refresh();}}
function goFwd(){if(histIdx<hist.length-1){histIdx++;cur=hist[histIdx];sel.clear();refresh();}}
function goUp(){const p=fp(cur);if(p)nav(p.id);}

/* ===== Refresh ===== */
function refresh(){
  buildTree();
  const nd=fn(cur);
  document.getElementById('title').textContent=nd?nd.label:'';
  const cr=document.getElementById('crumb');
  const path=getPath(cur);
  cr.innerHTML=path.length>1?path.slice(0,-1).map(function(p){return '<span onclick="nav(\''+p.id+'\')">'+esc(p.label)+'</span>';}).join('<span style="color:var(--fg3)"> › </span>'):'';
  document.getElementById('btnBack').disabled=histIdx<=0;
  document.getElementById('btnFwd').disabled=histIdx>=hist.length-1;
  var ap=document.getElementById('addrPath');
  ap.innerHTML=path.map(function(p){return '<span onclick="nav(\''+p.id+'\')">'+esc(p.label)+'</span>';}).join(' \\ ');
  updateToolbar();
  render();
  updateStatus();
}

function updateToolbar(){
  const ta=document.getElementById('tbActs');
  const hasSel=sel.size>0;
  const isRoot=cur==='0';
  let h='';
  if(hasSel){
    h+='<button class="tb-btn" onclick="cutSel()" title="Cắt (Ctrl+X)">✂️ <span>Cắt</span></button>';
    h+='<button class="tb-btn" onclick="copySel()" title="Sao chép (Ctrl+C)">📋 <span>Sao</span></button>';
    h+='<button class="tb-btn danger" onclick="delSel()" title="Xóa">🗑️ <span>Xóa</span></button>';
  }
  if(clip){
    h+='<button class="tb-btn" onclick="pasteSel()" title="Dán (Ctrl+V)">📌 <span>Dán</span></button>';
  }
  if(cur===IDEA_SEC){
    h+='<button class="tb-btn primary" onclick="openModal()">💡 <span>Thêm ý tưởng</span></button>';
  }else if(!isRoot){
    h+='<button class="tb-btn" onclick="promptNewFolder()">📁 <span>Thư mục</span></button>';
    h+='<button class="tb-btn primary" onclick="openModal()">＋ <span>Thêm mới</span></button>';
  }
  h+='<button class="tb-btn" onclick="toggleView()" title="Đổi kiểu xem">'+(viewMode==='tiles'?'📃':'🔲')+'</button>';
  h+='<button class="tb-btn" onclick="openBackup()" title="Sao lưu & Phục hồi">🛡️</button>';
  ta.innerHTML=h;
}

function updateStatus(){
  const kids=getChildren(cur);
  const items=its(cur);
  const total=kids.length+items.length;
  document.getElementById('stL').textContent=total+' mục'+(sel.size?' · '+sel.size+' đã chọn':'');
  document.getElementById('stR').textContent=clip?'📋 '+clip.length+' mục trong bộ nhớ':'';
  var ai=document.getElementById('addrInfo');
  ai.textContent=total+' mục';
}

/* ===== Render ===== */
function render(){
  const el=document.getElementById('ct');
  if(cur==='0'){el.innerHTML=renderDash();return;}
  if(cur===IDEA_SEC){el.innerHTML=renderIdeasPage();return;}
  const kids=getChildren(cur);
  const items=its(cur);
  const q=(document.getElementById('q').value||'').toLowerCase();
  const fItems=q?items.filter(function(i){return JSON.stringify(i).toLowerCase().indexOf(q)>=0;}):items;
  const fKids=q?kids.filter(function(k){return k.label.toLowerCase().indexOf(q)>=0;}):kids;
  const all=fKids.map(function(k){return Object.assign({},k,{_isFolder:true});}).concat(fItems.map(function(i){return Object.assign({},i,{_isFolder:false});}));
  if(!all.length&&!q){
    const nd=fn(cur);
    el.innerHTML='<div class="empty"><div class="empty-ico">'+(nd?nd.icon:'📁')+'</div><h4>Thư mục trống</h4><p>Nhấn chuột phải hoặc dùng nút trên thanh công cụ để tạo thư mục hoặc thêm mục mới</p></div>';
    return;
  }
  if(!all.length&&q){
    el.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><h4>Không tìm thấy</h4><p>Thử từ khóa khác</p></div>';
    return;
  }
  all.sort(function(a,b){
    if(a._isFolder&&!b._isFolder)return -1;
    if(!a._isFolder&&b._isFolder)return 1;
    var va=a[sortKey]||'',vb=b[sortKey]||'';
    if(sortKey==='updatedAt'||sortKey==='createdAt'){va=va||0;vb=vb||0;return sortAsc?va-vb:vb-va;}
    if(typeof va==='string')va=va.toLowerCase();
    if(typeof vb==='string')vb=vb.toLowerCase();
    return sortAsc?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0);
  });
  if(viewMode==='tiles')renderTilesView(el,all);
  else renderListView(el,all);
}

function renderTilesView(el,all){
  var h='<div class="tiles">';
  all.forEach(function(item){
    var id=item.id,isSel=sel.has(id);
    if(item._isFolder){
      h+='<div class="tile '+(isSel?'selected':'')+'" onclick="onTileClick(event,\''+id+'\',true)" ondblclick="nav(\''+id+'\')" oncontextmenu="onItemCtx(event,\''+id+'\',true)">';
      h+='<div class="tile-ico">'+(item.oicon||item.icon||'📁')+'</div>';
      h+='<div class="tile-lbl">'+esc(item.label)+'</div>';
      h+='<div class="tile-cnt">'+cnt(id)+'</div>';
      if(isUserFolder(id))h+='<div class="tile-type">Thư mục tùy chỉnh</div>';
      h+='</div>';
    }else{
      var st=item.status||'active';
      var isE=cur==='3',isP=cur==='4';
      var sl=isE?SLE:isP?SLP:SL;
      h+='<div class="tile '+(isSel?'selected':'')+'" onclick="onTileClick(event,\''+id+'\',false)" ondblclick="openModal(\''+id+'\')" oncontextmenu="onItemCtx(event,\''+id+'\',false)">';
      h+='<div class="tile-ico">'+getItemIcon(item)+'</div>';
      h+='<div class="tile-lbl">'+esc(item.name||'')+'</div>';
      h+='<div class="tile-type"><span class="badge b-'+st[0]+'">'+(sl[st]||st)+'</span></div>';
      h+='</div>';
    }
  });
  el.innerHTML=h+'</div>';
}

function renderListView(el,all){
  var isE=cur==='3',isP=cur==='4';
  var sl=isE?SLE:isP?SLP:SL;
  var arrow=sortAsc?' ▲':' ▼';
  var allIds=JSON.stringify(all.map(function(a){return a.id;}));
  var h='<div class="list-head">';
  h+='<div class="lc-check"><input type="checkbox" '+(sel.size===all.length&&all.length?'checked':'')+' onchange="toggleAll(this.checked,'+allIds.replace(/"/g,'&quot;')+')"></div>';
  h+='<div class="lc-ico"></div>';
  h+='<div class="lc-name" onclick="setSort(\'name\')" style="flex:1">Tên'+(sortKey==='name'?arrow:'')+'</div>';
  h+='<div class="lc-status" onclick="setSort(\'status\')">Trạng thái'+(sortKey==='status'?arrow:'')+'</div>';
  h+='<div class="lc-type">Loại</div>';
  h+='<div class="lc-date" onclick="setSort(\'updatedAt\')">Ngày'+(sortKey==='updatedAt'?arrow:'')+'</div>';
  h+='<div class="lc-acts"></div>';
  h+='</div>';
  all.forEach(function(item){
    var id=item.id,isSel=sel.has(id);
    var isRen=renamingId===id;
    if(item._isFolder){
      h+='<div class="list-row '+(isSel?'selected':'')+'" onclick="onTileClick(event,\''+id+'\',true)" ondblclick="nav(\''+id+'\')" oncontextmenu="onItemCtx(event,\''+id+'\',true)">';
      h+='<div class="lc-check"><input type="checkbox" '+(isSel?'checked':'')+' onclick="event.stopPropagation()" onchange="toggleSel(\''+id+'\')"></div>';
      h+='<div class="lc-ico">'+(item.oicon||item.icon||'📁')+'</div>';
      h+='<div class="lc-name '+(isRen?'editing':'')+'">'+(isRen?'<input value="'+esc(item.label)+'" onblur="finishRename(this,\''+id+'\',true)" onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){renamingId=null;refresh()}" id="renInput">':esc(item.label))+'</div>';
      h+='<div class="lc-status"><span class="tag t-folder">Thư mục</span></div>';
      h+='<div class="lc-type">'+cnt(id)+' mục</div>';
      h+='<div class="lc-date">'+fd(item.createdAt)+'</div>';
      h+='<div class="lc-acts">';
      if(isUserFolder(id)){
        h+='<button onclick="event.stopPropagation();startRename(\''+id+'\')" title="Đổi tên">✏️</button>';
        h+='<button onclick="event.stopPropagation();confirmDel(\''+id+'\',true)" title="Xóa">🗑️</button>';
      }
      h+='</div></div>';
    }else{
      var st=item.status||'active';
      h+='<div class="list-row '+(isSel?'selected':'')+'" onclick="onTileClick(event,\''+id+'\',false)" ondblclick="openModal(\''+id+'\')" oncontextmenu="onItemCtx(event,\''+id+'\',false)">';
      h+='<div class="lc-check"><input type="checkbox" '+(isSel?'checked':'')+' onclick="event.stopPropagation()" onchange="toggleSel(\''+id+'\')"></div>';
      h+='<div class="lc-ico">'+getItemIcon(item)+'</div>';
      h+='<div class="lc-name '+(isRen?'editing':'')+'">'+(isRen?'<input value="'+esc(item.name)+'" onblur="finishRename(this,\''+id+'\',false)" onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){renamingId=null;refresh()}" id="renInput">':esc(item.name||''))+'</div>';
      h+='<div class="lc-status"><span class="badge b-'+st[0]+'">'+(sl[st]||st)+'</span></div>';
      h+='<div class="lc-type">'+(item.type?'<span class="tag t-'+item.type+'">'+(TL[item.type]||'')+'</span>':'')+'</div>';
      h+='<div class="lc-date">'+fd(item.updatedAt)+'</div>';
      h+='<div class="lc-acts">';
      h+='<button onclick="event.stopPropagation();startRename(\''+id+'\')" title="Đổi tên">✏️</button>';
      h+='<button onclick="event.stopPropagation();openModal(\''+id+'\')" title="Sửa">📝</button>';
      h+='<button onclick="event.stopPropagation();confirmDel(\''+id+'\',false)" title="Xóa">🗑️</button>';
      h+='</div></div>';
    }
  });
  el.innerHTML=h;
  if(renamingId){var ri=document.getElementById('renInput');if(ri){ri.focus();ri.select();}}
}

function getItemIcon(item){
  if(item.type==='cg')return '🎓';
  if(item.type==='qt')return '⚙️';
  if(item.type==='hs')return '📄';
  if(item.type==='idea')return '💡';
  return '📋';
}

function renderDash(){
  var all=[];for(var k in D){if(k==='_folders')continue;(D[k]||[]).forEach(function(i){all.push(Object.assign({},i,{section:k}));});}
  var bs={active:0,pending:0,done:0};

/* ===== Ideas Page ===== */
function renderIdeasPage(){
  var list=its(IDEA_SEC).slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});

  if(q)list=list.filter(function(i){return (i.name||'').toLowerCase().indexOf(q)>=0||(i.desc||'').toLowerCase().indexOf(q)>=0;});
  var active=list.filter(function(x){return x.status==='active';});
  var pending=list.filter(function(x){return x.status==='pending';});
  var done=list.filter(function(x){return x.status==='done';});
  var h='<div style="margin-bottom:16px">';
  h+='<div class="stats" style="margin-bottom:16px">';
  h+='<div class="stat"><div class="stat-ico">💡</div><div class="stat-val">'+list.length+'</div><div class="stat-lbl">Tổng ý tưởng</div></div>';
  h+='<div class="stat"><div class="stat-ico">🟢</div><div class="stat-val" style="color:var(--green)">'+active.length+'</div><div class="stat-lbl">Đang mở</div></div>';
  h+='<div class="stat"><div class="stat-ico">🟡</div><div class="stat-val" style="color:var(--amber)">'+pending.length+'</div><div class="stat-lbl">Xem xét</div></div>';
  h+='<div class="stat"><div class="stat-ico">✅</div><div class="stat-val" style="color:var(--fg3)">'+done.length+'</div><div class="stat-lbl">Hoàn thành</div></div>';
  h+='</div></div>';
  if(!list.length){
    h+='<div class="empty"><div class="empty-ico">💡</div><h4>Chưa có ý tưởng</h4><p>Bấm nút 💡 ở góc dưới hoặc nút ＋ trên thanh công cụ để ghi ý tưởng mới</p></div>';
    return h;
  }
  function renderGroup(title,items,color){
    if(!items.length)return '';
    var g='<div class="sec-title" style="color:'+color+'">'+title+' ('+items.length+')</div>';
    items.forEach(function(item){
      var pri=item.priority||'normal';
      var isDone=item.status==='done';
      var dt=item.createdAt?new Date(item.createdAt).toLocaleString('vi-VN'):'';
      var updDt=item.updatedAt?new Date(item.updatedAt).toLocaleString('vi-VN'):'';
      g+='<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;border-left:4px solid '+(pri==='urgent'?'var(--red)':pri==='high'?'var(--amber)':'var(--border)')+';'+(isDone?'opacity:.6':'')+';cursor:pointer" ondblclick="openModal(\''+item.id+'\')" oncontextmenu="onItemCtx(event,\''+item.id+'\',false)">';
      g+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">';
      g+='<div style="flex:1;min-width:0">';
      g+='<div style="font-size:14px;font-weight:500;line-height:1.5;white-space:pre-wrap;word-break:break-word;'+(isDone?'text-decoration:line-through':'')+'">'+esc(item.name)+'</div>';
      if(item.desc)g+='<div style="font-size:12px;color:var(--fg2);margin-top:4px;white-space:pre-wrap">'+esc(item.desc)+'</div>';
      g+='</div>';
      g+='<div style="display:flex;gap:4px;flex-shrink:0">';
      g+='<button class="tb-btn" style="padding:4px 8px;font-size:11px" onclick="event.stopPropagation();ideaDone(\''+item.id+'\')" title="'+(isDone?'Mở lại':'Hoàn thành')+'">'+(isDone?'↩️':'✅')+'</button>';
      g+='<button class="tb-btn" style="padding:4px 8px;font-size:11px" onclick="event.stopPropagation();openModal(\''+item.id+'\')" title="Sửa">📝</button>';
      g+='<button class="tb-btn danger" style="padding:4px 8px;font-size:11px" onclick="event.stopPropagation();confirmDel(\''+item.id+'\',false)" title="Xóa">🗑️</button>';
      g+='</div></div>';
      g+='<div style="display:flex;gap:8px;margin-top:8px;font-size:10px;color:var(--fg3)">';
      g+='<span>'+PRI_ICON[pri]+' '+PRI_LABEL[pri]+'</span>';
      g+='<span>· Tạo: '+dt+'</span>';
      if(updDt!==dt)g+='<span>· Sửa: '+updDt+'</span>';
      g+='</div></div>';
    });
    return g;
  }
  h+=renderGroup('🔴 Khẩn cấp',active.filter(function(x){return x.priority==='urgent';}),'var(--red)');
  h+=renderGroup('🟡 Quan trọng',active.filter(function(x){return x.priority==='high';}),'var(--amber)');
  h+=renderGroup('💡 Bình thường',active.filter(function(x){return !x.priority||x.priority==='normal';}),'var(--accent)');
  h+=renderGroup('🔍 Đang xem xét',pending,'var(--amber)');
  h+=renderGroup('✅ Hoàn thành',done,'var(--fg3)');
  return h;
}

/* ===== Selection ===== */
function onTileClick(e,id,isFolder){
  e.preventDefault();
  if(e.target.tagName==='INPUT')return;
  if(e.ctrlKey||e.metaKey){toggleSel(id);}
  else if(e.shiftKey){sel.add(id);}
  else{sel.clear();sel.add(id);}
  refresh();
}
function toggleSel(id){if(sel.has(id))sel.delete(id);else sel.add(id);refresh();}
function toggleAll(checked,ids){if(checked)ids.forEach(function(id){sel.add(id);});else sel.clear();refresh();}
function setSort(key){if(sortKey===key)sortAsc=!sortAsc;else{sortKey=key;sortAsc=true;}render();}
function toggleView(){viewMode=viewMode==='tiles'?'list':'tiles';refresh();}

/* ===== Clipboard ===== */
function cutSel(){
  clip=[];sel.forEach(function(id){
    var isF=isUserFolder(id)||(getChildren(cur).some(function(k){return k.id===id;}));
    clip.push({id:id,isFolder:isF,from:cur});
  });
  clipMode='cut';sel.clear();toast('Đã cắt '+clip.length+' mục');refresh();
}
function copySel(){
  clip=[];sel.forEach(function(id){
    var isF=isUserFolder(id)||(getChildren(cur).some(function(k){return k.id===id;}));
    clip.push({id:id,isFolder:isF,from:cur});
  });
  clipMode='copy';sel.clear();toast('Đã sao chép '+clip.length+' mục');refresh();
}
function pasteSel(){
  if(!clip)return;
  var pasted=0;
  clip.forEach(function(c){
    if(c.isFolder){
      if(clipMode==='cut'){
        var ufs=D._folders||[];
        var f=ufs.find(function(x){return x.id===c.id;});
        if(f){f.parent=cur;pasted++;}
      }else{
        var orig=fn(c.id);
        if(orig){addFolder(cur,orig.label+' (bản sao)');pasted++;}
      }
    }else{
      var srcList=D[c.from]||[];
      var item=srcList.find(function(x){return x.id===c.id;});
      if(!item)return;
      if(clipMode==='cut'){
        D[c.from]=srcList.filter(function(x){return x.id!==c.id;});
        if(!D[cur])D[cur]=[];
        D[cur].push(item);pasted++;
      }else{
        if(!D[cur])D[cur]=[];
        D[cur].push({id:gid(),name:(item.name||'')+' (bản sao)',desc:item.desc,status:item.status,type:item.type,notes:item.notes,createdAt:Date.now(),updatedAt:Date.now()});pasted++;
      }
    }
  });
  sv();
  if(clipMode==='cut')clip=null;
  toast('Đã dán '+pasted+' mục');refresh();
}

/* ===== Rename ===== */
function startRename(id){renamingId=id;refresh();}
function finishRename(input,id,isFolder){
  var val=input.value.trim();
  renamingId=null;
  if(!val){refresh();return;}
  if(isFolder){
    if(isUserFolder(id)){renameFolder(id,val);}
  }else{
    var list=its(cur);
    var item=list.find(function(x){return x.id===id;});
    if(item){item.name=val;item.updatedAt=Date.now();si(cur,list);}
  }
  refresh();
}

/* ===== Delete ===== */
function confirmDel(id,isFolder){
  var nd=isFolder?fn(id):its(cur).find(function(x){return x.id===id;});
  var name=nd?(nd.label||nd.name):'';
  showConfirm('Xóa "'+name+'"?',isFolder?'Thư mục và toàn bộ nội dung bên trong sẽ bị xóa.':'Mục này sẽ bị xóa vĩnh viễn.',function(){
    if(isFolder){deleteFolder(id);}
    else{si(cur,its(cur).filter(function(x){return x.id!==id;}));}
    sel.delete(id);refresh();toast('Đã xóa');
  });
}
function delSel(){
  showConfirm('Xóa '+sel.size+' mục?','Các mục đã chọn sẽ bị xóa vĩnh viễn.',function(){
    sel.forEach(function(id){
      if(isUserFolder(id))deleteFolder(id);
      else si(cur,its(cur).filter(function(x){return x.id!==id;}));
    });
    sel.clear();refresh();toast('Đã xóa');
  });
}

function showConfirm(title,msg,onOk){
  document.getElementById('mBox').innerHTML='<div class="m-head"><h3>'+esc(title)+'</h3><button class="m-close" onclick="closeModal()">✕</button></div><div class="m-body"><p style="color:var(--fg2);font-size:13px">'+esc(msg)+'</p></div><div class="m-foot"><button class="m-btn" onclick="closeModal()">Hủy</button><button class="m-btn m-del" id="cfBtn">Xóa</button></div>';
  document.getElementById('mBg').classList.add('show');
  document.getElementById('cfBtn').onclick=function(){closeModal();onOk();};
}

/* ===== New folder prompt ===== */
function promptNewFolder(){
  document.getElementById('mBox').innerHTML='<div class="m-head"><h3>Tạo thư mục mới</h3><button class="m-close" onclick="closeModal()">✕</button></div><div class="m-body"><div class="fg"><label>Tên thư mục</label><input id="nfName" placeholder="Nhập tên thư mục..." autofocus></div></div><div class="m-foot"><button class="m-btn" onclick="closeModal()">Hủy</button><button class="m-btn m-primary" onclick="doNewFolder()">Tạo</button></div>';
  document.getElementById('mBg').classList.add('show');
  setTimeout(function(){var el=document.getElementById('nfName');if(el)el.focus();},100);
}
function doNewFolder(){
  var name=(document.getElementById('nfName')||{}).value||'';name=name.trim();
  if(!name)return;
  addFolder(cur,name);
  if(!exp[cur])exp[cur]=true;
  closeModal();refresh();toast('Đã tạo thư mục "'+name+'"');

/* ===== Context Menus ===== */
function showCtx(e,items){
  e.preventDefault();e.stopPropagation();
  var ctx=document.getElementById('ctx');
  var h='';
  items.forEach(function(it){
    if(it==='-'){h+='<div class="ctx-sep"></div>';return;}
    h+='<div class="ctx-item '+(it.cls||'')+'" onclick="hideCtx();'+it.action+'"><span class="ctx-ico">'+(it.icon||'')+'</span>'+esc(it.label)+(it.key?'<span class="ctx-key">'+it.key+'</span>':'')+'</div>';
  });
  ctx.innerHTML=h;
  ctx.classList.add('show');
  var r=ctx.getBoundingClientRect();
  var x=e.clientX,y=e.clientY;
  if(x+r.width>window.innerWidth)x=window.innerWidth-r.width-8;
  if(y+r.height>window.innerHeight)y=window.innerHeight-r.height-8;
  ctx.style.left=Math.max(4,x)+'px';ctx.style.top=Math.max(4,y)+'px';
}
function hideCtx(){document.getElementById('ctx').classList.remove('show');}

function onBgCtx(e){
  if(cur==='0'){e.preventDefault();return;}
  var menuItems=[
    {icon:'📁',label:'Tạo thư mục mới',action:'promptNewFolder()'},
    {icon:'➕',label:'Thêm mục mới',action:'openModal()'},
    '-',
    {icon:viewMode==='tiles'?'📃':'🔲',label:viewMode==='tiles'?'Xem danh sách':'Xem lưới',action:'toggleView()'},
    {icon:'🔄',label:'Làm mới',action:'refresh()'}
  ];
  if(clip){menuItems.push('-');menuItems.push({icon:'📌',label:'Dán ('+clip.length+' mục)',action:'pasteSel()',key:'Ctrl+V'});}
  menuItems.push('-');
  menuItems.push({icon:'📊',label:'Sắp theo tên',action:"setSort('name')"});
  menuItems.push({icon:'📅',label:'Sắp theo ngày',action:"setSort('updatedAt')"});
  showCtx(e,menuItems);
}

function onTreeCtx(e,id){
  e.stopPropagation();
  var items=[{icon:'📂',label:'Mở',action:"nav('"+id+"')"}];
  if(isUserFolder(id)){
    items.push({icon:'✏️',label:'Đổi tên',action:"nav('"+id+"');setTimeout(function(){viewMode='list';startRename('"+id+"');refresh();},100)"});
    items.push({icon:'🗑️',label:'Xóa thư mục',action:"confirmDel('"+id+"',true)",cls:'danger'});
  }
  items.push('-');
  items.push({icon:'📁',label:'Tạo thư mục con',action:"nav('"+id+"');setTimeout(promptNewFolder,100)"});
  showCtx(e,items);
}

function onItemCtx(e,id,isFolder){
  e.stopPropagation();
  if(!sel.has(id)){sel.clear();sel.add(id);}
  var multi=sel.size>1;
  var items=[];
  if(isFolder){
    items.push({icon:'📂',label:'Mở',action:"nav('"+id+"')"});
    if(isUserFolder(id)){
      items.push({icon:'✏️',label:'Đổi tên',action:"startRename('"+id+"');viewMode='list';refresh()"});
    }
  }else{
    items.push({icon:'📝',label:'Mở / Sửa',action:"openModal('"+id+"')"});
    items.push({icon:'✏️',label:'Đổi tên',action:"startRename('"+id+"');viewMode='list';refresh()"});
  }
  items.push('-');
  items.push({icon:'✂️',label:multi?'Cắt '+sel.size+' mục':'Cắt',action:'cutSel()',key:'Ctrl+X'});
  items.push({icon:'📋',label:multi?'Sao chép '+sel.size+' mục':'Sao chép',action:'copySel()',key:'Ctrl+C'});
  if(clip)items.push({icon:'📌',label:'Dán',action:'pasteSel()',key:'Ctrl+V'});
  items.push('-');
  items.push({icon:'🗑️',label:multi?'Xóa '+sel.size+' mục':'Xóa',action:multi?'delSel()':"confirmDel('"+id+"',"+isFolder+")",cls:'danger',key:'Del'});
  showCtx(e,items);
  refresh();
}

    saveFn='svI()';

  var del=eid?'<button class="m-btn m-del" onclick="confirmDel(\''+eid+'\',false);closeModal()">Xóa</button>':'';
  document.getElementById('mBox').innerHTML='<div class="m-head"><h3>'+title+'</h3><button class="m-close" onclick="closeModal()">✕</button></div><div class="m-body">'+body+'</div><div class="m-foot">'+del+'<span style="flex:1"></span><button class="m-btn" onclick="closeModal()">Hủy</button><button class="m-btn m-primary" onclick="'+saveFn+'">Lưu</button></div>';
  document.getElementById('mBg').classList.add('show');
  setTimeout(function(){var el=document.getElementById('fn');if(el)el.focus();},100);
}

function closeModal(){document.getElementById('mBg').classList.remove('show');eid=null;}
function toggleSidebar(){document.getElementById('side').classList.toggle('open');document.getElementById('shade').classList.toggle('show');}

/* ===== Keyboard shortcuts ===== */
document.addEventListener('keydown',function(e){
  if(document.querySelector('.modal-bg.show'))return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.ctrlKey||e.metaKey){
    if(e.key==='x'){e.preventDefault();if(sel.size)cutSel();}
    if(e.key==='c'){e.preventDefault();if(sel.size)copySel();}
    if(e.key==='v'){e.preventDefault();if(clip)pasteSel();}
    if(e.key==='a'){e.preventDefault();var kids=getChildren(cur);var items=its(cur);kids.concat(items).forEach(function(x){sel.add(x.id);});refresh();}
  }
  if(e.key==='Delete'&&sel.size){e.preventDefault();delSel();}
  if(e.key==='F2'&&sel.size===1){e.preventDefault();viewMode='list';var ids=[];sel.forEach(function(id){ids.push(id);});startRename(ids[0]);refresh();}
  if(e.key==='Backspace'&&!e.ctrlKey){e.preventDefault();goUp();}
  if(e.key==='F5'){e.preventDefault();refresh();}
});
document.addEventListener('click',function(e){
  if(!e.target.closest('.ctx'))hideCtx();
  if(!e.target.closest('.tile')&&!e.target.closest('.list-row')&&!e.target.closest('.toolbar')&&!e.target.closest('.ctx')){
    if(!e.target.closest('.modal-bg')&&!e.target.closest('.side')){sel.clear();refresh();}
  }
});
document.addEventListener('contextmenu',function(e){if(!e.target.closest('.ct')&&!e.target.closest('.nd-row'))e.preventDefault();});

/* ===== Ý tưởng (bong bóng) ===== */
const IDEA_SEC='5.4';
const PRI_ICON={normal:'⚪',high:'🟡',urgent:'🔴'};
const PRI_LABEL={normal:'Bình thường',high:'Quan trọng',urgent:'Khẩn cấp'};

function ideaToggle(){
  document.body.classList.toggle('idea-open');
  if(document.body.classList.contains('idea-open')){
    ideaRenderList();
    setTimeout(function(){document.getElementById('ideaText').focus();},100);
  }
}

function ideaSave(){
  var txt=document.getElementById('ideaText').value.trim();
  if(!txt)return;
  var pri=document.getElementById('ideaPri').value;
  var list=its(IDEA_SEC);
  list.push({id:gid(),name:txt,desc:'',status:'active',type:'idea',priority:pri,createdAt:Date.now(),updatedAt:Date.now()});
  si(IDEA_SEC,list);
  document.getElementById('ideaText').value='';
  document.getElementById('ideaPri').value='normal';
  ideaRenderList();
  if(cur===IDEA_SEC||cur==='0')refresh();
  toast('Đã lưu ý tưởng');
}

function ideaDelete(id){
  si(IDEA_SEC,its(IDEA_SEC).filter(function(x){return x.id!==id;}));
  ideaRenderList();
  if(cur===IDEA_SEC||cur==='0')refresh();
  toast('Đã xóa');
}

function ideaDone(id){
  var list=its(IDEA_SEC);
  var item=list.find(function(x){return x.id===id;});
  if(item){item.status=item.status==='done'?'active':'done';item.updatedAt=Date.now();si(IDEA_SEC,list);}
  ideaRenderList();
  if(cur===IDEA_SEC||cur==='0')refresh();
}

function ideaRenderList(){
  var list=its(IDEA_SEC).slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  var el=document.getElementById('ideaList');
  var cntEl=document.getElementById('ideaCount');
  var totalEl=document.getElementById('ideaTotal');
  var active=list.filter(function(x){return x.status!=='done';}).length;
  if(active>0){cntEl.textContent=active;cntEl.style.display='';}else{cntEl.style.display='none';}
  totalEl.textContent=list.length+' ý tưởng';
  if(!list.length){
    el.innerHTML='<div class="idea-empty"><div class="idea-empty-ico">💡</div>Chưa có ý tưởng nào<br><small>Ghi nhanh ý tưởng đột xuất ở đây</small></div>';
    return;
  }
  var h='';
  list.forEach(function(item){
    var pri=item.priority||'normal';
    var isDone=item.status==='done';
    var dt=item.createdAt?new Date(item.createdAt).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
    h+='<div class="idea-item" style="'+(isDone?'opacity:.5;':'')+'border-left:3px solid '+(pri==='urgent'?'var(--red)':pri==='high'?'var(--amber)':'var(--border)')+'">';
    h+='<div class="idea-item-acts">';
    h+='<button onclick="ideaDone(\''+item.id+'\')" title="'+(isDone?'Mở lại':'Hoàn thành')+'">'+(isDone?'↩️':'✅')+'</button>';
    h+='<button onclick="ideaDelete(\''+item.id+'\')" title="Xóa">🗑️</button>';
    h+='</div>';
    h+='<div class="idea-item-text" style="'+(isDone?'text-decoration:line-through':'')+'">'+esc(item.name)+'</div>';
    h+='<div class="idea-item-meta">';
    h+='<span>'+PRI_ICON[pri]+' '+PRI_LABEL[pri]+'</span>';
    h+='<span>·</span><span>'+dt+'</span>';
    h+='</div></div>';
  });
  el.innerHTML=h;
}

function ideaUpdateCount(){
  var list=its(IDEA_SEC);
  var active=list.filter(function(x){return x.status!=='done';}).length;
  var cntEl=document.getElementById('ideaCount');
  if(active>0){cntEl.textContent=active;cntEl.style.display='';}else{cntEl.style.display='none';}
}

/* ===== Backup & Restore ===== */
var BK_KEY='qlcv4_backup';
var BK_MAX=5;

function autoBackup(){
  try{
    var now=Date.now();
    var last=parseInt(localStorage.getItem('qlcv4_bk_last')||'0');
    if(now-last<300000)return;
    var raw=localStorage.getItem('qlcv4');
    if(!raw)return;
    var backups=JSON.parse(localStorage.getItem(BK_KEY)||'[]');
    backups.unshift({ts:now,data:raw});
    if(backups.length>BK_MAX)backups=backups.slice(0,BK_MAX);
    localStorage.setItem(BK_KEY,JSON.stringify(backups));
    localStorage.setItem('qlcv4_bk_last',String(now));
  }catch(e){}
}

function openBackup(){
  document.getElementById('bkModal').style.display='';
  var backups=[];
  try{backups=JSON.parse(localStorage.getItem(BK_KEY)||'[]');}catch(e){}
  var raw=localStorage.getItem('qlcv4')||'{}';
  var size=(new Blob([raw])).size;
  var h='<b>Dữ liệu hiện tại:</b> '+Math.round(size/1024)+' KB<br>';
  h+='<b>Bản sao lưu tự động:</b> '+backups.length+'/'+BK_MAX;
  if(backups.length){
    h+=' (gần nhất: '+new Date(backups[0].ts).toLocaleString('vi-VN')+')';
  }
  h+='<br><br>⏱ Tự động sao lưu mỗi 5 phút khi có thay đổi.';
  h+='<br>📱 Dữ liệu lưu trong trình duyệt — <b>xuất file JSON để giữ an toàn</b> khi đổi thiết bị hoặc xóa cache.';
  document.getElementById('bkInfo').innerHTML=h;
}

function closeBackup(){document.getElementById('bkModal').style.display='none';}

function exportData(){
  var raw=localStorage.getItem('qlcv4')||'{}';
  var dt=new Date().toISOString().slice(0,10);
  var blob=new Blob([JSON.stringify({version:'qlcv4',exportedAt:new Date().toISOString(),data:JSON.parse(raw)},null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='dongdoi-backup-'+dt+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Đã xuất file sao lưu');
}

function importData(input){
  var file=input.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var obj=JSON.parse(e.target.result);
      var data=obj.data||obj;
      if(typeof data!=='object')throw new Error('invalid');
      if(!confirm('Nhập dữ liệu sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại.\n\nDữ liệu hiện tại sẽ được sao lưu tự động trước khi ghi đè.\n\nTiếp tục?'))return;
      autoBackup();
      D=data;
      sv();
      refresh();
      ideaUpdateCount();
      closeBackup();
      toast('Đã nhập dữ liệu thành công');
    }catch(err){
      alert('File không hợp lệ. Vui lòng chọn file JSON đã xuất từ ứng dụng.');
    }
  };
  reader.readAsText(file);
  input.value='';
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

ld();refresh();ideaUpdateCount();autoBackup();
setInterval(autoBackup,300000);
